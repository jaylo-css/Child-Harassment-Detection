name: Backend CI

on:
  push:
    branches: [main]
    paths-ignore: ["android/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Train baseline on synthetic data
        run: python scripts/train_baseline.py --no-pan
      - name: Tests
        run: python -m pytest -q
      - name: Evaluate on held-out synthetic test split
        run: python scripts/evaluate.py && cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t safechat-guardian .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 safechat-guardian
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 2; done
          curl -fs localhost:8080/healthz
          curl -fs -o /dev/null localhost:8080/alerts
          curl -fs -o /dev/null localhost:8080/simulator
          docker logs app | tail -20
