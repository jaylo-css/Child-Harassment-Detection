[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safechat-guardian"
version = "0.1.0"
description = "Defensive child-safety prototype: grooming-stage risk scoring and privacy-preserving guardian alerts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - prototype" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "sqlmodel>=0.0.21",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "numpy>=1.26",
  "qrcode>=7.4",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "anthropic>=0.40"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "templates/**/*.html", "static/*", "detection/rules/*.yaml", "alerts/*.yaml", "ingest/sources/scenarios/*.json", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["android", "data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]  # line length is handled by `ruff format`
